services:
  eink-hass-frame:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - PLATFORMIO_CORE_DIR=/root/.platformio
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - FIRMWARE_WIFI_SSID=${FIRMWARE_WIFI_SSID:-}
      - FIRMWARE_WIFI_PASSWORD=${FIRMWARE_WIFI_PASSWORD:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next-cache:/app/.next
      - firmware-artifacts:/app/.firmware-artifacts
      - platformio-cache:/root/.platformio
    command: ["/bin/sh", "-lc", "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0 --port 3000"]

  eink-hass-frame-prod:
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PLATFORMIO_CORE_DIR=/root/.platformio
      - FIRMWARE_WIFI_SSID=${FIRMWARE_WIFI_SSID:-}
      - FIRMWARE_WIFI_PASSWORD=${FIRMWARE_WIFI_PASSWORD:-}
    volumes:
      - platformio-cache:/root/.platformio

volumes:
  firmware-artifacts:
  next-cache:
  node_modules:
  platformio-cache:
