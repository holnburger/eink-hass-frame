services:
  eink-hass-frame:
    image: ${EINK_HASS_FRAME_IMAGE:-ghcr.io/holnburger/eink-hass-frame:0.4.4}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        BUILD_VERSION: ${EINK_HASS_FRAME_BUILD_VERSION:-0.4.4}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PLATFORMIO_CORE_DIR: /root/.platformio
      DEVICE_HOME_ASSISTANT_URL: ${DEVICE_HOME_ASSISTANT_URL:-}
      DEVICE_HOME_ASSISTANT_TOKEN: ${DEVICE_HOME_ASSISTANT_TOKEN:-}
    volumes:
      - firmware-artifacts:/app/.firmware-artifacts
      - platformio-cache:/root/.platformio

volumes:
  firmware-artifacts:
  next-cache:
  node_modules:
  platformio-cache:
