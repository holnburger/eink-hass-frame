services:
  eink-hass-frame:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PLATFORMIO_CORE_DIR=/root/.platformio
      - FIRMWARE_WIFI_SSID=${FIRMWARE_WIFI_SSID:-}
      - FIRMWARE_WIFI_PASSWORD=${FIRMWARE_WIFI_PASSWORD:-}
    volumes:
      - platformio-cache:/root/.platformio

volumes:
  platformio-cache:
