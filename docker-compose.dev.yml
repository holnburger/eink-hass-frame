services:
  eink-hass-frame:
    image: ${EINK_HASS_FRAME_DEV_IMAGE:-eink-hass-frame-dev:0.4.6}
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        BUILD_VERSION: ${EINK_HASS_FRAME_BUILD_VERSION:-0.4.6}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PLATFORMIO_CORE_DIR: /root/.platformio
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "1"
      DEVICE_HOME_ASSISTANT_URL: ${DEVICE_HOME_ASSISTANT_URL:-}
      DEVICE_HOME_ASSISTANT_TOKEN: ${DEVICE_HOME_ASSISTANT_TOKEN:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next-cache:/app/.next
      - firmware-artifacts:/app/.firmware-artifacts
      - platformio-cache:/root/.platformio
    command:
      ["/bin/sh", "-lc", "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0 --port 3000"]

volumes:
  firmware-artifacts:
  next-cache:
  node_modules:
  platformio-cache:
