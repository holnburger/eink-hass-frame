name: "E-Ink HASS Frame"
version: "0.4.7"
slug: "eink_hass_frame"
description: "Build firmware and manage M5PaperS3 e-ink dashboards for Home Assistant."
image: "ghcr.io/holnburger/{arch}-eink-hass-frame-addon"
stage: experimental
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_title: "E-Ink Frame"
panel_icon: "mdi:tablet-dashboard"
panel_admin: false
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8099]/api/health"
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct web UI (optional)"
options: {}
schema:
  device_home_assistant_url: "str"
  device_home_assistant_token: "password"
